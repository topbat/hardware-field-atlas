<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" aria-label="BubblePal 泡泡挂件硬件规格信息图"><rect width="1200" height="800" rx="25" fill="#f4f6f3"/><rect x="52" y="41" width="29" height="4" fill="#bc542c"/><text x="52" y="84" font-size="40" fill="#1f2525" font-weight="700">BubblePal 泡泡挂件</text><text x="53" y="155" font-size="22" fill="#536462" font-weight="600">硬件规格  /  HARDWARE SPECIFICATIONS</text><rect x="50" y="182" width="532" height="420" rx="20" fill="#e8eeeb"/><image href="data:image/webp;base64," x="58" y="190" width="516" height="404" preserveAspectRatio="xMidYMid meet"/><text x="55" y="631" font-size="19" fill="#536462" font-weight="500">AI 生成配图 · 参数来自档案来源</text><path d="M620 185H1138" stroke="#d8ddda"/><text x="622" y="210" font-size="20" fill="#546262" font-weight="600">品牌</text><text x="784" y="210" font-size="21" fill="#1f2525" font-weight="500">跃然创新 Haivivi</text><path d="M620 247H1138" stroke="#d8ddda"/><text x="622" y="272" font-size="20" fill="#546262" font-weight="600">形态</text><text x="784" y="272" font-size="21" fill="#1f2525" font-weight="500">可附着玩偶的交互挂件</text><path d="M620 309H1138" stroke="#d8ddda"/><text x="622" y="334" font-size="20" fill="#546262" font-weight="600">外观与接口</text><text x="784" y="334" font-size="21" fill="#1f2525" font-weight="500">挂件是圆顶小球状设备，实拍样本</text><text x="784" y="358" font-size="21" fill="#1f2525" font-weight="500">可见白色上盖、浅蓝底座、侧面的</text><text x="784" y="382" font-size="21" fill="#1f2525" font-weight="500">声孔与橙色挂绳。</text><path d="M620 415H1138" stroke="#d8ddda"/><text x="622" y="440" font-size="20" fill="#546262" font-weight="600">AI 能力</text><text x="784" y="440" font-size="21" fill="#1f2525" font-weight="500">角色对话</text><text x="52" y="770" font-size="16" fill="#536462" font-weight="600">硬件志  /  HARDWARE ATLAS</text></svg>