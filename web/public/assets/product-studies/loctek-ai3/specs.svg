<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" aria-label="乐歌 AI3 智能升降桌硬件规格信息图"><rect width="1200" height="800" rx="25" fill="#f4f6f3"/><rect x="52" y="41" width="29" height="4" fill="#bc542c"/><text x="52" y="84" font-size="40" fill="#1f2525" font-weight="700">乐歌 AI3 智能升降桌</text><text x="53" y="155" font-size="22" fill="#536462" font-weight="600">硬件规格  /  HARDWARE SPECIFICATIONS</text><rect x="50" y="182" width="532" height="420" rx="20" fill="#e8eeeb"/><image href="data:image/webp;base64," x="58" y="190" width="516" height="404" preserveAspectRatio="xMidYMid meet"/><text x="55" y="631" font-size="19" fill="#536462" font-weight="500">AI 生成配图 · 参数来自档案来源</text><path d="M620 185H1138" stroke="#d8ddda"/><text x="622" y="210" font-size="20" fill="#546262" font-weight="600">品牌</text><text x="784" y="210" font-size="21" fill="#1f2525" font-weight="500">乐歌 Loctek</text><path d="M620 247H1138" stroke="#d8ddda"/><text x="622" y="272" font-size="20" fill="#546262" font-weight="600">型号</text><text x="784" y="272" font-size="21" fill="#1f2525" font-weight="500">AI3</text><path d="M620 309H1138" stroke="#d8ddda"/><text x="622" y="334" font-size="20" fill="#546262" font-weight="600">外观与接口</text><text x="784" y="334" font-size="21" fill="#1f2525" font-weight="500">体验样机是升降桌架配桌板的办公</text><text x="784" y="358" font-size="21" fill="#1f2525" font-weight="500">桌，桌面控制部可用于触控和语音</text><text x="784" y="382" font-size="21" fill="#1f2525" font-weight="500">操作。不同面板尺寸以选定商品为</text><text x="784" y="406" font-size="21" fill="#1f2525" font-weight="500">准。</text><text x="52" y="770" font-size="16" fill="#536462" font-weight="600">硬件志  /  HARDWARE ATLAS</text></svg>