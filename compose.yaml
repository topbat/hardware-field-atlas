services:
  atlas:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - path: .env
        required: false
    volumes:
      - atlas-state:/var/lib/atlas
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  atlas-state:
